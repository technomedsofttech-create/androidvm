name: APK with QEMU

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: 1 - Extract project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP"
          unzip -q "$ZIP" -d _src
          if [ -d _src/QemuVmManager ]; then cp -a _src/QemuVmManager/. .; else cp -a _src/. .; fi
          rm -rf _src
          chmod +x tools/*.sh tools/*.py

      - name: 2 - Reuse QEMU from an earlier build
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/qemu-data
          key: qemu-android-${{ hashFiles('tools/**') }}

      - name: 3 - Free disk space
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af || true
          df -h /

      - name: 4 - BUILD QEMU (1-3 hours)
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          pip install --quiet patchelf
          tools/build-qemu-android.sh 2>&1 | tee qemu.log

      - name: 5 - Check QEMU is present
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a
          test -f app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          test -d app/src/main/assets/qemu-data

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 6 - Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 7 - Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show errors on the summary page
        if: failure()
        run: |
          {
            echo "## Build errors (copy everything below and send it to Claude)"
            echo '```'
            for f in qemu.log build.log; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              grep -E "^e: |error:|ERROR|What went wrong|FAILED|Could not|Unresolved|Execution failed|No such file|cannot find|undefined reference|not found" "$f" | tail -n 60
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            qemu.log
            build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: VmManager-QEMU-apk
          path: app/build/outputs/apk/debug/*.apk
